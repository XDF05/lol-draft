name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint, format, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check backend formatting
        working-directory: backend
        run: npm run format:check

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check Prisma migrations structure
        working-directory: backend
        run: npm run db:check-migrations

      - name: Check documentation links and commands
        run: node scripts/check-docs.mjs

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: league_draft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Prepare isolated test database
        run: |
          docker exec ${{ job.services.postgres.id }} \
            psql -U postgres -d league_draft -c 'CREATE DATABASE league_draft_test;'
          docker exec ${{ job.services.postgres.id }} \
            psql -U postgres -d league_draft_test -c 'CREATE SCHEMA IF NOT EXISTS draft_db;'

      - name: Apply migrations to the test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/league_draft_test?schema=draft_db
          JWT_SECRET: ci-test-secret-not-for-production
        run: npm run db:migrate

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/league_draft_test?schema=draft_db
          JWT_SECRET: ci-test-secret-not-for-production
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
        run: npm run test:ci

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:ci

  e2e:
    name: End-to-end draft (Compose)
    if: github.event_name == 'pull_request'
    needs:
      - lint
      - backend-test
      - frontend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install e2e dependencies
        working-directory: backend
        run: npm ci

      - name: Create Compose environment
        run: |
          cat > .env <<EOF
          JWT_SECRET=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          # Keep CI fast; the turn engine still uses the spec 30s action timer.
          DRAFT_FINALIZATION_TIMER_MS=5000
          EOF

      - name: Start the Compose stack
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Run the full draft suite
        working-directory: backend
        env:
          E2E_API_URL: http://127.0.0.1:4000
        run: npm run test:e2e

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Publish Compose images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint
      - backend-test
      - frontend-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-api:latest
            ${{ steps.image.outputs.prefix }}-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-web:latest
            ${{ steps.image.outputs.prefix }}-web:${{ github.sha }}

      - name: Verify the published images
        run: |
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.prefix }}-api:${{ github.sha }}"
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.prefix }}-web:${{ github.sha }}"
